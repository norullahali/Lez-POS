name: lez_pos
description: Lez POS - Professional Arabic Desktop Point of Sale System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^13.2.0

  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  pdf: ^3.10.8
  printing: ^5.12.0

  intl: ^0.20.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  crypto: ^3.0.7

  file_picker: ^8.0.0

  esc_pos_utils_plus: ^2.0.4

  # Windows RAW printer API — required at runtime by RawWindowsPrinter.
  win32: ^5.5.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/   